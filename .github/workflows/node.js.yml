name: SVR CI

on:
  push:
    branches: ["main", "claude/**"]
  pull_request:
    branches: ["main"]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  e2e:
    name: Emulator end-to-end (rules + functions + API)
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - run: npm ci
      - run: npm run build -w @svr/cloud-functions
      - name: Dummy Razorpay secrets for the emulator
        run: printf 'RAZORPAY_KEY_ID=rzp_test_x\nRAZORPAY_KEY_SECRET=x\nRAZORPAY_WEBHOOK_SECRET=x\n' > backend/cloud-functions/.secret.local
      - run: npx -y firebase-tools@14 emulators:exec --project svr-maths-academy --only auth,firestore,functions,storage "npm run e2e -w @svr/scripts"
